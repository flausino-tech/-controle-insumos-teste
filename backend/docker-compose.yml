services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: estoque
      POSTGRES_PASSWORD: estoque_pw
      POSTGRES_DB: estoque
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estoque"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://estoque:estoque_pw@db:5432/estoque?schema=public"
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env antes de subir}
      PORT: 3001
      NODE_ENV: production
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      # false = acesso via http://IP-da-fábrica (rede local, sem HTTPS).
      # Só troque para true se houver um HTTPS de verdade na frente.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "3001:3001"

volumes:
  db_data:
